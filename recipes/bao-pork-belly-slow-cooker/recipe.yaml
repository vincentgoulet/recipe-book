title: Slow cooker braised pork belly for bao
status: draft
tags: [pork, slow-cooker, braise, bao]
servings: 20 bao
time:
  prep: null
  cook: 4 h on High + {TBD} stovetop
  total: null
updated: 2026-10-12

summary: Pork belly and flank braised in soy, Shaoxing wine and spices, finished in its own reduced glaze.

equipment:
  - Large pot
  - Pan
  - Slow cooker
  - Strainer
  - Wide saucepan

ingredients:
  - group: Braise
    items:
      - qty: "2.5"
        unit: kg
        name: pork belly + flank
        prep: belly in 4 cm cubes, flank in 5 cm pieces
      - qty: "7"
        unit: tbsp
        name: dark soy sauce
      - qty: "10"
        unit: tbsp
        name: light soy sauce
      - qty: "500"
        unit: ml
        name: Shaoxing wine
      - qty: "180"
        unit: g
        name: granulated sugar
      - qty: "100"
        unit: g
        name: fresh ginger
        prep: sliced
      - qty: "12"
        unit: cloves
        name: garlic
        prep: crushed
      - qty: "5"
        name: star anise
      - qty: "2"
        name: cinnamon sticks
      - qty: "1.2"
        unit: L
        name: salted chicken broth
      - qty: "3"
        unit: tbsp
        name: oyster sauce
      - qty: "2"
        unit: tsp
        name: toasted sesame oil
  - group: To serve
    items:
      - name: bao buns
      - name: quick pickled cucumber
      - name: coriander
      - name: spring onion
      - name: crushed roasted peanuts
        optional: true

steps:
  - section: Braise
    items:
      - text: Boil the pork for 5 minutes. Drain and rinse.
      - text: In a pan over medium heat, melt the sugar without stirring (swirl the pan) until deep amber.
      - text: Add the pork carefully (it splatters) and brown well on several sides, in batches.
      - text: Add the ginger and garlic; cook 1 minute.
      - text: Deglaze with the Shaoxing wine.
      - text: Add the soy sauces, oyster sauce, broth, star anise and cinnamon. Bring just to a simmer.
      - text: Transfer to the slow cooker. Cook on High for 4 h, until a chopstick slides in with almost no resistance.
  - section: Glaze
    items:
      - text: Remove the pork. Strain the liquid into a wide saucepan.
      - text: Boil on max heat, stirring often, until it coats a spoon like maple syrup. Don't let it go candy-thick; loosen with a splash of hot water if it does.
      - text: Stir in the sesame oil. Taste; add light soy 1 tbsp at a time if needed.
      - text: Return the pork to the glaze for 5 minutes.
  - section: Serve
    items:
      - text: "Warm the bao ({TBD})."
      - text: "Fill each: pork, a spoonful of glaze, pickled cucumber, coriander, spring onion, peanuts."

